<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Meeting Summariser</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body class="meeting-page">
        <header class="mfe-header">
            <div>
                <h2>Meeting Summariser</h2>
            </div>
            <div id="streamHealth" class="status-pill">checking</div>
        </header>

        <section class="panel">
            <textarea id="transcript" placeholder="Paste meeting transcript..."></textarea>
            <div class="action-row">
                <button id="summariseBtn" type="button">Start SSE Stream</button>
                <button id="stopBtn" type="button" disabled>Stop / Cancel</button>
                <button id="clearStreamBtn" type="button">Clear</button>
            </div>
            <div id="status" class="queue-banner">Idle</div>
        </section>

        <section class="split-grid">
            <div class="panel">
                <div class="panel-header">
                    <h3>Generated Summary</h3>
                    <span id="streamMeta">no stream yet</span>
                </div>
                <div id="output" class="scroll-box empty-state">No tokens yet.</div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <h3>SSE Events</h3>
                    <span id="streamQueueMeta">idle</span>
                </div>
                <div id="streamEvents" class="event-log"></div>
            </div>
        </section>
        <script src="/config.js"></script>
        <script src="/retry.js"></script>
        <script src="/app.js" defer></script>
    </body>
</html>
