<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Document Q&A</title>
        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    <body class="docqa-page">
        <h2>Document Q&A</h2>
        <div class="row">
            <input
                id="prompt"
                placeholder="Ask a question about the document..."
            />
            <button id="askBtn">Submit (HIGH)</button>
            <button id="prefetchBtn">Prefetch suggestions (LOW)</button>
        </div>
        <div id="queueBanner"></div>
        <div class="row">
            <button id="cancelBtn">Cancel</button>
        </div>
        <div id="chat"></div>
        <script src="/js/mfe-doc-qa.js" defer></script>
    </body>
</html>
