<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Edge Runtime Status</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <header class="app-header">
            <div>
                <h1>System Status</h1>
            </div>
            <div class="nav-actions">
                <button id="refreshBtn" type="button">Refresh</button>
            </div>
        </header>

        <main class="dashboard-grid">
            <section class="panel span-2">
                <div class="panel-header">
                    <h2>API Status</h2>
                    <span id="lastUpdated">checking</span>
                </div>
                <div id="apiGrid" class="metric-grid"></div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>Process Status</h2>
                    <span id="processSummary">-</span>
                </div>
                <div id="processList" class="table-list"></div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>Worker Status</h2>
                    <span id="workerSummary">-</span>
                </div>
                <div id="workerList" class="table-list"></div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>Scheduler</h2>
                    <span>singleton shell</span>
                </div>
                <div id="schedulerGrid" class="metric-grid"></div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>MFE Requests</h2>
                    <span id="mfeRequestSummary">active by MFE</span>
                </div>
                <div id="mfeRequestList" class="table-list"></div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>MFE Apps</h2>
                    <span>independent ports</span>
                </div>
                <div id="mfeStatusList" class="table-list"></div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>Raw Status</h2>
                    <span>debug snapshot</span>
                </div>
                <pre id="rawJson" class="json-view">{}</pre>
            </section>
        </main>

        <script src="/dashboard-config.js"></script>
        <script src="/app.js" defer></script>
    </body>
</html>
